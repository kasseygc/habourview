# Axon Health's palette (read from axonhealth.io): white and lavender-grey surfaces, near-black and
# slate text, one sage-green accent. Red / amber / green are kept for status flags only.

[theme]
base = "light"
primaryColor = "#578550"
backgroundColor = "#f7f5fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#21273f"
borderColor = "#eceaf2"
dataframeBorderColor = "#eceaf2"
dataframeHeaderBackgroundColor = "#fdfdfd"
dataframeHeaderTextColor = "#7e7d91"
linkColor = "#446a3f"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "Inter, system-ui, sans-serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]
headingFontSizes = ["1.4rem", "1.1rem", "1rem", "0.95rem", "0.9rem", "0.85rem"]
metricValueFontWeight = 500
chartCategoricalColors = ["#446a3f", "#92b68c", "#54586b", "#7e7d91", "#a9a7b8"]

redColor = "#d64545"
redTextColor = "#b42318"
redBackgroundColor = "#fdecea"
orangeColor = "#e0a020"
orangeTextColor = "#9a5b00"
orangeBackgroundColor = "#fdf3dc"
greenColor = "#578550"
greenTextColor = "#35522f"
greenBackgroundColor = "#edf3ef"
grayTextColor = "#54586b"
grayBackgroundColor = "#f0f0f3"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/InterVariable.woff2"
weight = "100 900"
style = "normal"

[browser]
gatherUsageStats = false

[server]
headless = true
enableStaticServing = true

[client]
# No developer menu or Deploy button for the people using the dashboard.
toolbarMode = "minimal"
