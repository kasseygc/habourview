# Evaluation set for the natural-language -> spec step (D-19).
#
# Each case: a question, optional house definitions already saved, and what should happen.
#   kind: answer | clarify | decline
#   answer:  gold spec. Scored on spec fields and on executed results (gold vs predicted).
#   clarify: the term that should be asked about (omit if any term is acceptable).
#   decline: acceptable reasons.
# Categories mirror the four supported question types plus clarification, definitions and safety.

- id: c01
  category: counts
  question: How many admissions did we have each month in 2025?
  kind: answer
  spec: {metric: admissions, group_by: [month], time_window: {preset: fy2025}, chart: bar}
- id: c02
  category: counts
  question: Show referrals by quarter.
  kind: answer
  spec: {metric: referrals, group_by: [quarter], chart: bar}
- id: c03
  category: counts
  question: How many people were discharged in the first half of 2025, by reason?
  kind: answer
  spec: {metric: discharges, group_by: [discharge_reason], time_window: {preset: custom, start: 2025-01-01, end: 2025-06-30}, chart: bar}
- id: c04
  category: counts
  question: Intake assessments per month in FY2024
  kind: answer
  spec: {metric: intakes, group_by: [month], time_window: {preset: fy2024}, chart: bar}
- id: c05
  category: counts
  question: How many admissions in 2025 had the entrance fee waived?
  kind: answer
  spec: {metric: admissions, filters: [{field: fee_status, values: [waived]}], time_window: {preset: fy2025}, chart: bar}
- id: c06
  category: counts
  question: Transfers out to other programs by month in 2025
  kind: answer
  spec: {metric: discharges, group_by: [month], filters: [{field: discharge_reason, values: [transfer]}], time_window: {preset: fy2025}, chart: bar}
- id: c07
  category: counts
  question: How many people completed the program in each fiscal year?
  kind: answer
  spec: {metric: discharges, group_by: [fiscal_year], filters: [{field: completion_group, values: [completed]}], chart: bar}
- id: c08
  category: counts
  question: Compare the number of referrals in 2024 and 2025.
  kind: answer
  spec: {metric: referrals, group_by: [fiscal_year], chart: bar}

- id: o01
  category: occupancy
  question: How full was the house each month in 2025?
  kind: answer
  spec: {metric: occupancy, group_by: [month], time_window: {preset: fy2025}, chart: line}
- id: o02
  category: occupancy
  question: What was our average bed occupancy for 2025 as a whole?
  kind: answer
  spec: {metric: occupancy, group_by: [fiscal_year], time_window: {preset: fy2025}, chart: bar}
- id: o03
  category: occupancy
  question: Occupancy by quarter
  kind: answer
  spec: {metric: occupancy, group_by: [quarter], chart: line}
- id: o04
  category: occupancy
  question: What was bed occupancy from March to June 2025, month by month?
  kind: answer
  spec: {metric: occupancy, group_by: [month], time_window: {preset: custom, start: 2025-03-01, end: 2025-06-30}, chart: line}

- id: f01
  category: outcomes
  question: Show the 6-month follow-up outcomes.
  kind: answer
  spec: {metric: followup_outcomes, group_by: [outcome], filters: [{field: horizon, values: [6m]}], chart: stacked_bar}
- id: f02
  category: outcomes
  question: 12-month outcomes for people who completed versus people who left early
  kind: answer
  spec: {metric: followup_outcomes, group_by: [outcome, completion_group], filters: [{field: horizon, values: [12m]}], chart: stacked_bar}
- id: f03
  category: outcomes
  question: What share of people were engaged in recovery at their 6-month follow-up?
  kind: answer
  spec: {metric: followup_engaged_rate, filters: [{field: horizon, values: [6m]}], chart: bar}
- id: f04
  category: outcomes
  question: Engaged in recovery at 6 months, waived fee versus paid fee
  kind: answer
  spec: {metric: followup_engaged_rate, group_by: [fee_status], filters: [{field: horizon, values: [6m]}], chart: bar}
- id: f05
  category: outcomes
  question: How many people were lost to follow-up at 6 months?
  kind: answer
  spec: {metric: followup_outcomes, group_by: [outcome], filters: [{field: horizon, values: [6m]}], chart: stacked_bar}

- id: r01
