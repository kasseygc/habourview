[project]
name = "axon-harbourview"
version = "0.1.0"
description = "Descriptive dashboard and natural-language analytics prototype for a fictional recovery home (synthetic data only)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=5.4",
    "anthropic>=0.70",
    "duckdb>=1.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sqlglot>=25.0",
    "streamlit>=1.40",
    "vl-convert-python>=1.6",
]

[project.scripts]
axon = "axon.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
