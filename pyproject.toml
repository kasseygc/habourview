[project]
name = "axon-harbourview"
version = "0.1.0"
description = "Descriptive dashboard and natural-language analytics prototype for a fictional recovery home (synthetic data only)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=5.4",
    "duckdb>=1.1",
    "en-core-web-lg",
    "en-core-web-sm",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "spacy>=3.8,<3.9",
    "sqlglot>=25.0",
    "streamlit>=1.40",
    "vl-convert-python>=1.6",
]

[project.scripts]
axon = "axon.cli:main"

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
